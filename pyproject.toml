[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeproof"
version = "0.1.1"
description = "Verify whether BibTeX cited works exist, using Crossref, DBLP, Semantic Scholar, OpenAlex and arXiv."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Huanyi Xie" }]
keywords = ["bibtex", "citation", "hallucination", "scholarly", "crossref"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://citeproof.pocketplay.win"
Repository = "https://github.com/xiehuanyi/citeproof"
Website = "https://citeproof.pocketplay.win"

[project.scripts]
citeproof = "citeproof.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
